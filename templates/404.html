<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | MediTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center space-y-6">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-teal-50 dark:bg-teal-950 text-teal-600 dark:text-teal-400 flex items-center justify-center font-black text-2xl shadow-lg shadow-teal-500/20">
      404
    </div>
    <div class="space-y-2">
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Clinical Record Not Found</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
        The requested medical resource does not exist, has been archived, or you lack the required tenant access credentials.
      </p>
    </div>
    <div class="flex items-center justify-center gap-3">
      <a href="/app/" class="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-teal-600 hover:bg-teal-700 shadow-md shadow-teal-600/20 transition">
        Return to Dashboard
      </a>
      <a href="/" class="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition">
        Sign In Portal
      </a>
    </div>
  </div>
</body>
</html>
