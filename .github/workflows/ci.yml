name: MediTrack CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meditrack_db
          POSTGRES_USER: meditrack_user
          POSTGRES_PASSWORD: meditrack_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff and Black
      run: |
        ruff check .
        black --check .

    - name: Run Database Migrations
      env:
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: meditrack_db
        DB_USER: meditrack_user
        DB_PASSWORD: meditrack_password
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        SECRET_KEY: ci-testing-secret-key-12345
      run: |
        python manage.py migrate

    - name: Run Test Suite with Pytest & Coverage
      env:
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: meditrack_db
        DB_USER: meditrack_user
        DB_PASSWORD: meditrack_password
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        SECRET_KEY: ci-testing-secret-key-12345
      run: |
        pytest --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=85
