app = "meditrack-clinical-suite"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DJANGO_SETTINGS_MODULE = "meditrack.settings.prod"
  DEBUG = "False"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "20s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
