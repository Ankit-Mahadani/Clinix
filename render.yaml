databases:
  - name: meditrack-db
    databaseName: meditrack_db
    user: meditrack_user
    plan: free
    region: oregon

services:
  # 1. Django REST Backend Web Service
  - type: web
    name: meditrack-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn meditrack.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 60"
    healthCheckPath: "/api/health/"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: meditrack.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        fromDatabase:
          name: meditrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SEED_DEMO
        value: "true"

  # 2. React Vite Frontend Static Site
  - type: web
    name: meditrack-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: meditrack-api
          envVarKey: RENDER_EXTERNAL_URL
          value: "${RENDER_EXTERNAL_URL}/api"
