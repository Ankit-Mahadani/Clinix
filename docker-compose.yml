version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: meditrack_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-meditrack_db}
      POSTGRES_USER: ${DB_USER:-meditrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meditrack_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-meditrack_user} -d ${DB_NAME:-meditrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meditrack_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meditrack_web
    restart: unless-stopped
    command: /app/entrypoint.sh
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-meditrack-change-me-in-production-super-secret-key-12345}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-meditrack_db}
      - DB_USER=${DB_USER:-meditrack_user}
      - DB_PASSWORD=${DB_PASSWORD:-meditrack_password}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SETTINGS_MODULE=meditrack.settings.dev
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      - ACCESS_TOKEN_LIFETIME_MINUTES=15
      - REFRESH_TOKEN_LIFETIME_DAYS=7
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - meditrack_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meditrack_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - web
    networks:
      - meditrack_network

volumes:
  postgres_data:
    name: meditrack_postgres_data

networks:
  meditrack_network:
    name: meditrack_network
